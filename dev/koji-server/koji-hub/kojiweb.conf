[web]
SiteName = Local Koji
KojiHubURL = https://localhost/kojihub
KojiFilesURL = https://localhost/kojifiles

# A copy readable by apache, made by entrypoint.sh
WebCert = /etc/kojiweb/kojiweb.pem
ClientCA = /etc/pki/koji/koji_ca_cert.crt
KojiHubCA = /etc/pki/koji/koji_ca_cert.crt

LoginTimeout = 72
# Secret comes from .env: entrypoint.sh writes web.conf.d/secret.conf
