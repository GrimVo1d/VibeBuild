# DBName, DBUser and DBPass come from .env: entrypoint.sh writes hub.conf.d/db.conf
[hub]
DBHost = db

KojiDir = /mnt/koji

AuthPrincipal = kojihub

DNUsernameComponent = CN
# The web UI logs users in on their behalf; the hub compares DNs in RFC 2253 form
ProxyDNs = CN=koji-web,OU=kojiweb,O=Koji,L=Local,ST=Local,C=US

LoginCreatesUser = On
KojiWebURL = https://koji-hub/koji
