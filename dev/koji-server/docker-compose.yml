services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make setup to create .env}
      POSTGRES_DB: ${POSTGRES_DB:-koji}
    volumes:
      - koji-db-data:/var/lib/postgresql/data
    networks:
      - koji-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koji}"]
      interval: 5s
      timeout: 3s
      retries: 10

  koji-hub:
    build:
      context: ./koji-hub
      args:
        FEDORA_VERSION: ${FEDORA_VERSION:-44}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Web UI only; vibebuild-dev and the builder talk to the hub over koji-net.
      - "127.0.0.1:${KOJI_HTTPS_PORT:-8443}:443"
    volumes:
      - ./ssl:/etc/pki/koji:ro,Z
      - koji-data:/mnt/koji
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make setup to create .env}
      POSTGRES_DB: ${POSTGRES_DB:-koji}
      KOJIWEB_SECRET: ${KOJIWEB_SECRET:?run make setup to create .env}
    networks:
      - koji-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost/kojihub >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  koji-builder:
    build:
      context: ./koji-builder
      args:
        FEDORA_VERSION: ${FEDORA_VERSION:-44}
    depends_on:
      koji-hub:
        condition: service_healthy
    volumes:
      - ./ssl:/etc/pki/koji:ro,Z
      - koji-data:/mnt/koji
    privileged: true
    networks:
      - koji-net

  vibebuild-dev:
    build:
      context: ./vibebuild-dev
      args:
        FEDORA_VERSION: ${FEDORA_VERSION:-44}
    depends_on:
      koji-hub:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ./ssl:/etc/pki/koji:ro,Z
      - vibebuild-cache:/root/.cache/vibebuild
    environment:
      KOJI_TARGET: ${KOJI_TARGET:-f44}
      KOJI_BUILD_TAG: ${KOJI_BUILD_TAG:-f44-build}
    networks:
      - koji-net
    # keep the container alive via entrypoint sleep infinity

volumes:
  koji-db-data:
  koji-data:
  vibebuild-cache:

networks:
  koji-net:
    driver: bridge
