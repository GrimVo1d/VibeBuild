services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kojisecret}
      POSTGRES_DB: ${POSTGRES_DB:-koji}
    volumes:
      - koji-db-data:/var/lib/postgresql/data
    networks:
      - koji-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koji}"]
      interval: 5s
      timeout: 3s
      retries: 10

  koji-hub:
    build: ./koji-hub
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${KOJI_HTTPS_PORT:-8443}:443"
    volumes:
      - ./ssl:/etc/pki/koji:ro,Z
      - koji-data:/mnt/koji
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kojisecret}
      POSTGRES_DB: ${POSTGRES_DB:-koji}
    networks:
      - koji-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost/kojihub >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  koji-builder:
    build: ./koji-builder
    depends_on:
      koji-hub:
        condition: service_healthy
    volumes:
      - ./ssl:/etc/pki/koji:ro,Z
      - koji-data:/mnt/koji
    privileged: true
    networks:
      - koji-net

  vibebuild-dev:
    build: ./vibebuild-dev
    depends_on:
      koji-hub:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ./ssl:/etc/pki/koji:ro,Z
      - vibebuild-cache:/root/.cache/vibebuild
    networks:
      - koji-net
    # keep the container alive via entrypoint sleep infinity

volumes:
  koji-db-data:
  koji-data:
  vibebuild-cache:

networks:
  koji-net:
    driver: bridge
