[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibebuild"
version = "0.1.0"
description = "Koji extension for automatic dependency resolution and building"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "VibeBuild Team"}
]
keywords = ["koji", "rpm", "srpm", "build", "fedora", "dependency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.32.4",
    "urllib3>=2.6.0",  # bounded decompression of mirror responses (CVE-2025-66418, CVE-2025-66471)
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.17",
    "mypy>=1.0",
    "pre-commit>=4.0",
]

[project.scripts]
vibebuild = "vibebuild.cli:main"

[tool.setuptools.packages.find]
include = ["vibebuild*"]
exclude = ["tests*", "dev*", "ansible*", "scripts*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["vibebuild"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=vibebuild --cov-report=term-missing -m 'not integration'"
markers = ["integration: needs the dev Koji stand, run with -m integration inside vibebuild-dev"]

[tool.coverage.run]
source = ["vibebuild"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
# No global skips: each accepted finding has an inline `# nosec` with its reason above it.
exclude_dirs = ["tests", "dev"]
