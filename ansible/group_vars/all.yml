---
# One Fedora host runs PostgreSQL, the hub, the web UI and the builder.
koji_hub_fqdn: "koji.internal"
koji_hub_url: "https://{{ koji_hub_fqdn }}/kojihub"
koji_web_url: "https://{{ koji_hub_fqdn }}/koji"
koji_files_url: "https://{{ koji_hub_fqdn }}/kojifiles"

fedora_version: 44
fedora_mirror: "https://dl.fedoraproject.org/pub/fedora/linux"
koji_dest_tag: "f{{ fedora_version }}"
koji_build_tag: "f{{ fedora_version }}-build"
koji_target: "f{{ fedora_version }}"
koji_arch: "{{ ansible_facts['architecture'] }}"

koji_admin_user: "kojiadmin"
# Koji host name of the builder; it is also the CN of the builder certificate
koji_builder_host: "kojibuilder"

koji_pki_dir: /etc/pki/koji
koji_cert_org: "VibeBuild"

postgresql_db: "koji"
postgresql_user: "koji"

# Generated on the control node on the first run and kept in ansible/credentials/
# (git-ignored). Override them, e.g. from a vault, to use your own.
postgresql_password: >-
  {{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/postgresql_password',
  length=32, chars=['ascii_letters', 'digits']) }}
kojiweb_secret: >-
  {{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/kojiweb_secret',
  length=32, chars=['ascii_letters', 'digits']) }}

# PostgreSQL listens on localhost only and the web UI is served over HTTPS
firewall_ports:
  - 443/tcp
