---
# koji-web needs jinja2 but does not require it
- name: Install the Koji web UI
  ansible.builtin.dnf:
    name:
      - koji-web
      - python3-jinja2
    state: present

- name: Configure the web UI
  ansible.builtin.template:
    src: web.conf.j2
    dest: /etc/kojiweb/web.conf
    owner: root
    group: apache
    mode: "0640"
  notify: Restart Apache

- name: Let the web UI read its certificate
  ansible.builtin.file:
    path: "{{ koji_pki_dir }}/kojiweb.pem"
    owner: root
    group: apache
    mode: "0640"
  notify: Restart Apache
