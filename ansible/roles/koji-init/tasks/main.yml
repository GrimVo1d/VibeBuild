---
- name: Create the koji client directory for root
  ansible.builtin.file:
    path: /root/.koji
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Configure the koji client for root
  ansible.builtin.template:
    src: koji-config.j2
    dest: /root/.koji/config
    owner: root
    group: root
    mode: "0600"

- name: Wait for the hub
  ansible.builtin.uri:
    url: "{{ koji_hub_url }}"
    method: POST
    body: <?xml version="1.0"?><methodCall><methodName>getAPIVersion</methodName></methodCall>
    headers:
      Content-Type: text/xml
  register: koji_hub_up
  until: koji_hub_up is succeeded
  retries: 30
  delay: 5

# The first admin cannot be granted through the hub, Koji's docs bootstrap it in SQL
- name: Create the admin user
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_user: "{{ postgresql_user }}"
    login_password: "{{ postgresql_password }}"
    login_db: "{{ postgresql_db }}"
    query: >-
      INSERT INTO users (name, status, usertype)
      SELECT %(name)s, 0, 0
      WHERE NOT EXISTS (SELECT 1 FROM users WHERE name = %(name)s)
    named_args:
      name: "{{ koji_admin_user }}"
  register: koji_admin_created
  changed_when: koji_admin_created.rowcount > 0

- name: Grant the admin permission
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_user: "{{ postgresql_user }}"
    login_password: "{{ postgresql_password }}"
    login_db: "{{ postgresql_db }}"
    query: >-
      INSERT INTO user_perms (user_id, perm_id, creator_id, active)
      SELECT u.id, p.id, u.id, TRUE FROM users u, permissions p
      WHERE u.name = %(name)s AND p.name = 'admin'
      AND NOT EXISTS (SELECT 1 FROM user_perms WHERE user_id = u.id
                      AND perm_id = p.id AND active)
    named_args:
      name: "{{ koji_admin_user }}"
  register: koji_admin_granted
  changed_when: koji_admin_granted.rowcount > 0

- name: Set up the builder, tags, target, build groups and external repos
  ansible.builtin.command:
    argv: "{{ ['koji'] + item }}"
  loop: "{{ koji_setup_commands }}"
  register: koji_setup
  changed_when: koji_setup.rc == 0
  failed_when: koji_setup.rc != 0 and koji_setup.stderr is not search(koji_already_done)

# add-group-pkg exits with 0 for packages already in the group, so compare first
- name: Read the build groups
  ansible.builtin.command:
    argv: [koji, call, --json-output, getTagGroups, "{{ koji_build_tag }}"]
  register: koji_groups
  changed_when: false

- name: Fill the build groups
  ansible.builtin.command:
    argv: "{{ ['koji', 'add-group-pkg', koji_build_tag, item.group] + koji_missing }}"
  vars:
    koji_group: "{{ koji_groups.stdout | from_json | selectattr('name', '==', item.group) | first }}"
    koji_missing: "{{ item.packages | difference(koji_group.packagelist | map(attribute='package')) }}"
  loop:
    - {group: build, packages: "{{ koji_build_group_packages }}"}
    - {group: srpm-build, packages: "{{ koji_srpm_build_group_packages }}"}
  loop_control:
    label: "{{ item.group }}"
  when: koji_missing | length > 0
  register: koji_group_pkg
  changed_when: true

# Without kojira, a repo is created only on request; vibebuild requests the later ones.
# The task waits for kojid, which the next role starts.
- name: Create the first build repo
  ansible.builtin.command:
    argv: [koji, regen-repo, --make-task, --nowait, "{{ koji_build_tag }}"]
  when: koji_setup is changed or koji_group_pkg is changed
  changed_when: true
