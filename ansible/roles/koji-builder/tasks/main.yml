---
- name: Install the Koji builder
  ansible.builtin.dnf:
    name:
      - koji-builder
      - mock
      - createrepo_c
    state: present

- name: Create the mock user
  ansible.builtin.user:
    name: kojibuilder
    system: true
    groups: mock
    append: true

- name: Configure the builder
  ansible.builtin.template:
    src: kojid.conf.j2
    dest: /etc/kojid/kojid.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart kojid

- name: Start the builder
  ansible.builtin.systemd_service:
    name: kojid
    state: started
    enabled: true
