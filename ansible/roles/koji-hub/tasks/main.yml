---
- name: Install the Koji hub
  ansible.builtin.dnf:
    name:
      - koji-hub
      - httpd
      - mod_ssl
      - python3-mod_wsgi
    state: present

- name: Create the Koji file tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: apache
    group: apache
    mode: "0755"
  loop:
    - /mnt/koji
    - /mnt/koji/packages
    - /mnt/koji/repos
    - /mnt/koji/work
    - /mnt/koji/scratch

- name: Configure the hub
  ansible.builtin.template:
    src: hub.conf.j2
    dest: /etc/koji-hub/hub.conf
    owner: root
    group: apache
    mode: "0640"
  notify: Restart Apache

- name: Configure Apache
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/httpd/conf.d/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - ssl.conf
    - kojihub.conf
  notify: Restart Apache

- name: Check whether the Koji schema is loaded
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_user: "{{ postgresql_user }}"
    login_password: "{{ postgresql_password }}"
    login_db: "{{ postgresql_db }}"
    query: SELECT to_regclass('public.users') IS NOT NULL AS loaded
  register: koji_schema
  changed_when: false

# As the koji role, so the hub owns its tables
- name: Load the Koji schema
  ansible.builtin.command:
    argv: [psql, -h, 127.0.0.1, -U, "{{ postgresql_user }}", -d, "{{ postgresql_db }}",
           -q, -v, ON_ERROR_STOP=1, -f, /usr/share/koji/schema.sql]
  environment:
    PGPASSWORD: "{{ postgresql_password }}"
  when: not koji_schema.query_result[0].loaded
  changed_when: true

- name: Collect the service list
  ansible.builtin.service_facts:

- name: Open the firewall
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_ports }}"
  when: ansible_facts.services['firewalld.service'].state | default('') == 'running'

- name: Start Apache
  ansible.builtin.systemd_service:
    name: httpd
    state: started
    enabled: true
