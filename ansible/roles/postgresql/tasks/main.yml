---
- name: Install PostgreSQL
  ansible.builtin.dnf:
    name:
      - postgresql-server
      - python3-psycopg2
    state: present

- name: Initialize the database cluster
  ansible.builtin.command: postgresql-setup --initdb
  args:
    creates: /var/lib/pgsql/data/PG_VERSION

- name: Allow password logins for Koji from localhost only
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: /var/lib/pgsql/data/pg_hba.conf
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart PostgreSQL

- name: Start PostgreSQL
  ansible.builtin.systemd_service:
    name: postgresql
    state: started
    enabled: true

- name: Apply the authentication settings before Koji logs in
  ansible.builtin.meta: flush_handlers

- name: Create the Koji database role
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgresql_user }}"
    password: "{{ postgresql_password }}"
  no_log: true

# Owning the database gives the role the public schema on PostgreSQL 15+
- name: Create the Koji database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgresql_db }}"
    owner: "{{ postgresql_user }}"
    encoding: UTF-8
